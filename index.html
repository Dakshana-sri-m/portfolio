                          <span
                            key={sIdx}
                            className="px-3 py-1.5 rounded-sm bg-obsidian-surface border border-obsidian-border text-xs font-mono-tag text-bone hover:border-chartreuse hover:text-chartreuse transition-colors cursor-default"
                          >
                            {skill}
                          </span>
                        ))}
                      </div>
                    </div>
                  </div>
                ))}
              </div>

            </div>
          </section>

          {/* ========================================================================= */}
          {/* SECTION 07: GROWTH / STUDENT → BUILDER → LEADER & PERSONALITY             */}
          {/* ========================================================================= */}
          <section id="growth" className="py-24 border-b border-obsidian-border">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              
              {/* Header */}
              <div className="mb-16">
                <div className="flex items-center gap-3 font-mono-tag text-xs text-chartreuse mb-3">
                  <span>07</span>
                  <span className="w-8 h-px bg-chartreuse/40"></span>
                  <span>THE THREE CHAPTERS</span>
                </div>
                <h2 className="font-editorial text-4xl sm:text-6xl text-bone">
                  {data.growth.title}
                </h2>
                <p className="mt-4 text-bone-muted text-base sm:text-lg max-w-2xl font-light">
                  {data.growth.subtitle}
                </p>
              </div>

              {/* 3 Major Chapters */}
              <div className="space-y-12 mb-20">
                {data.growth.chapters.map((ch, idx) => (
                  <div
                    key={idx}
                    className="p-8 sm:p-10 bg-obsidian-card border border-obsidian-border rounded-sm hover:border-chartreuse/40 transition-all"
                  >
                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
                      
                      <div className="lg:col-span-4 space-y-3">
                        <span className="font-mono-tag text-xs text-chartreuse tracking-widest block font-bold">
                          {ch.label}
                        </span>
                        <h3 className="font-editorial text-4xl text-bone">
                          {ch.title}
                        </h3>
                        <p className="font-mono-tag text-xs text-bone-muted">
                          {ch.subtitle}
                        </p>
                      </div>

                      <div className="lg:col-span-8 space-y-6 lg:border-l lg:border-obsidian-border lg:pl-10">
                        <p className="text-bone-muted text-base font-light leading-relaxed">
                          {ch.description}
                        </p>

                        {/* Highlights if Chapter 1 or 2 */}
                        {ch.highlights && (
                          <ul className="space-y-2.5 pt-2">
                            {ch.highlights.map((h, hIdx) => (
                              <li key={hIdx} className="flex items-start gap-3 text-sm text-bone font-light">
                                <span className="text-chartreuse mt-1">✦</span>
                                <span>{h}</span>
                              </li>
                            ))}
                          </ul>
                        )}

                        {/* Chapter 3 Leadership Breakdown (LEED Director, Class Rep, Namadhu Pangu) */}
                        {ch.initiatives && (
                          <div className="space-y-6 pt-4 border-t border-obsidian-border">
                            {ch.initiatives.map((init, iIdx) => (
                              <div key={iIdx} className="p-4 bg-obsidian-surface rounded border border-obsidian-border space-y-2">
                                <div className="flex flex-wrap items-center justify-between gap-2 font-mono-tag text-xs">
                                  <span className="text-chartreuse font-bold">{init.role}</span>
                                  <span className="text-bone-muted">{init.organization}</span>
                                </div>
                                <ul className="space-y-1.5 text-xs text-bone-muted pt-1">
                                  {init.highlights.map((hi, hiIdx) => (
                                    <li key={hiIdx} className="flex items-start gap-2">
                                      <span className="text-bone-dim">→</span>
                                      <span>{hi}</span>
                                    </li>
                                  ))}
                                </ul>
                              </div>
                            ))}
                          </div>
                        )}

                      </div>

                    </div>
                  </div>
                ))}
              </div>

              {/* Personality Snapshot: ENFJ Protagonist */}
              <div className="p-8 sm:p-10 bg-obsidian-card border border-chartreuse/30 rounded-sm relative overflow-hidden">
                <div className="flex flex-wrap items-center justify-between gap-4 pb-6 border-b border-obsidian-border mb-8">
                  <div>
                    <span className="font-mono-tag text-xs text-chartreuse tracking-widest uppercase block mb-1">
                      HOW I TEND TO WORK · OPERATIONAL PROFILE
                    </span>
                    <h3 className="font-editorial text-3xl text-bone">
                      {data.personality.type} — {data.personality.typeName}
                    </h3>
                    <p className="font-mono-tag text-xs text-bone-muted mt-1">
                      {data.personality.tagline}
                    </p>
                  </div>

                  {/* Percentage Metric Badges */}
                  <div className="flex flex-wrap gap-2 font-mono-tag text-xs">
                    <span className="px-2.5 py-1 bg-obsidian-surface border border-obsidian-border rounded text-bone-muted">
                      Extraverted <strong className="text-chartreuse">{data.personality.scores.extraverted}</strong>
                    </span>
                    <span className="px-2.5 py-1 bg-obsidian-surface border border-obsidian-border rounded text-bone-muted">
                      Intuitive <strong className="text-chartreuse">{data.personality.scores.intuitive}</strong>
                    </span>
                    <span className="px-2.5 py-1 bg-obsidian-surface border border-obsidian-border rounded text-bone-muted">
                      Feeling <strong className="text-chartreuse">{data.personality.scores.feeling}</strong>
                    </span>
                    <span className="px-2.5 py-1 bg-obsidian-surface border border-obsidian-border rounded text-bone-muted">
                      Judging <strong className="text-chartreuse">{data.personality.scores.judging}</strong>
                    </span>
                  </div>
                </div>

                {/* 5 Core Translated Traits */}
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
                  {data.personality.traits.map((trait, tIdx) => (
                    <div key={tIdx} className="p-4 bg-obsidian-surface rounded border border-obsidian-border">
                      <span className="font-mono-tag text-xs text-chartreuse font-bold block mb-2">
                        {trait.label}
                      </span>
                      <p className="text-xs text-bone-muted font-light leading-relaxed">
                        {trait.desc}
                      </p>
                    </div>
                  ))}
                </div>

              </div>

            </div>
          </section>

          {/* ========================================================================= */}
          {/* SECTION 08: NOW / LIVE OPERATIONAL DASHBOARD                              */}
          {/* ========================================================================= */}
          <section id="now" className="py-24 border-b border-obsidian-border bg-obsidian/40">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              
              {/* Header */}
              <div className="mb-16">
                <div className="flex items-center gap-3 font-mono-tag text-xs text-chartreuse mb-3">
                  <span>08</span>
                  <span className="w-8 h-px bg-chartreuse/40"></span>
                  <span>REAL-TIME STATUS</span>
                </div>
                <h2 className="font-editorial text-4xl sm:text-6xl text-bone">
                  {data.now.title}
                </h2>
                <p className="mt-4 text-bone-muted text-base sm:text-lg max-w-2xl font-light">
                  {data.now.subtitle}
                </p>
              </div>

              {/* Status Feed */}
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                {data.now.items.map((item, idx) => (
                  <div key={idx} className="p-6 bg-obsidian-card border border-obsidian-border rounded-sm hover:border-chartreuse/40 transition-all flex flex-col justify-between">
                    <div>
                      <div className="flex items-center justify-between font-mono-tag text-xs mb-3">
                        <span className="text-chartreuse font-bold uppercase tracking-wider">{item.label}</span>
                        <span className="text-[10px] text-bone-dim px-2 py-0.5 rounded bg-obsidian-surface border border-obsidian-border">
                          {item.badge}
                        </span>
                      </div>
                      <p className="text-sm text-bone-muted font-light leading-relaxed">
                        {item.detail}
                      </p>
                    </div>
                  </div>
                ))}
              </div>

            </div>
          </section>

          {/* ========================================================================= */}
          {/* SECTION 09: CONTACT / EDITORIAL CLOSING                                   */}
          {/* ========================================================================= */}
          <section id="contact" className="py-24 border-b border-obsidian-border relative">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-12 items-start">
                
                {/* Left Contact Narrative & Links */}
                <div className="lg:col-span-6 space-y-8">
                  <div>
                    <div className="flex items-center gap-3 font-mono-tag text-xs text-chartreuse mb-3">
                      <span>09</span>
                      <span className="w-8 h-px bg-chartreuse/40"></span>
                      <span>GET IN TOUCH</span>
                    </div>
                    <h2 className="font-editorial text-4xl sm:text-6xl text-bone leading-tight">
                      {data.contact.headline}
                    </h2>
                    <p className="mt-4 text-bone-muted text-base sm:text-lg font-light max-w-lg leading-relaxed">
                      {data.contact.subheadline}
                    </p>
                  </div>

                  {/* Direct Contact Card */}
                  <div className="p-6 bg-obsidian-card border border-obsidian-border rounded-sm space-y-4">
                    <div className="font-mono-tag text-xs text-chartreuse uppercase tracking-wider">
                      DIRECT INQUIRIES & COLLABORATIONS
                    </div>
                    
                    <div className="flex items-center justify-between p-3 bg-obsidian-surface border border-obsidian-border rounded">
                      <span className="font-mono-tag text-xs text-bone">{data.meta.socials.email}</span>
                      <button
                        onClick={() => {
                          navigator.clipboard.writeText(data.meta.socials.email);
                          showToast("Email copied to clipboard!", "success");
                        }}
                        className="px-2.5 py-1 bg-chartreuse text-obsidian font-mono-tag text-xs font-bold rounded hover:bg-white"
                      >
                        COPY
                      </button>
                    </div>

                    <p className="font-mono-tag text-xs text-bone-muted">
                      📍 {data.contact.city} · {data.contact.availability}
                    </p>
                  </div>

                  {/* Social Profile Grid */}
                  <div className="space-y-3">
                    <span className="font-mono-tag text-xs text-bone-dim uppercase block">NETWORK & REPOSITORIES</span>
                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 font-mono-tag text-xs">
                      {[
                        { label: "LINKEDIN", url: data.meta.socials.linkedin },
                        { label: "GITHUB", url: data.meta.socials.github },
                        { label: "KAGGLE", url: data.meta.socials.kaggle },
                        { label: "LEETCODE", url: data.meta.socials.leetcode }
                      ].map((s, idx) => (
                        <a
                          key={idx}
                          href={s.url}
                          target="_blank"
                          rel="noreferrer"
                          className="p-3 bg-obsidian-surface border border-obsidian-border hover:border-chartreuse text-bone-muted hover:text-chartreuse rounded-sm text-center flex items-center justify-center gap-1.5 transition-all"
                        >
                          <span>{s.label}</span>
                          <Icon name="arrow-up-right" className="w-3.5 h-3.5" />
                        </a>
                      ))}
                    </div>
                  </div>

                </div>

                {/* Right Glass Contact Form */}
                <div className="lg:col-span-6">
                  <form
                    onSubmit={(e) => {
                      e.preventDefault();
                      showToast("Inquiry sent successfully! Dakshana will respond shortly.", "success");
                      e.target.reset();
                    }}
                    className="p-8 sm:p-10 bg-obsidian-card border border-obsidian-border rounded-sm space-y-6 shadow-2xl"
                  >
                    <h3 className="font-editorial text-2xl text-bone mb-2">
                      Send an Inquiry or Message
                    </h3>

                    <div className="space-y-1">
                      <label className="font-mono-tag text-xs text-bone-muted uppercase block">YOUR NAME</label>
                      <input
                        type="text"
                        required
                        placeholder="Dr. Alex Rivera / Maya Patel"
                        className="w-full px-4 py-3 bg-obsidian-surface border border-obsidian-border rounded text-bone placeholder:text-bone-dim focus:outline-none focus:border-chartreuse text-sm"
                      />
                    </div>

                    <div className="space-y-1">
                      <label className="font-mono-tag text-xs text-bone-muted uppercase block">EMAIL ADDRESS</label>
                      <input
                        type="email"
                        required
                        placeholder="alex@enterprise.org"
                        className="w-full px-4 py-3 bg-obsidian-surface border border-obsidian-border rounded text-bone placeholder:text-bone-dim focus:outline-none focus:border-chartreuse text-sm"
                      />
                    </div>

                    <div className="space-y-1">
                      <label className="font-mono-tag text-xs text-bone-muted uppercase block">SUBJECT / TOPIC</label>
                      <input
                        type="text"
                        required
                        placeholder="Research Collaboration / Venture Discussion"
                        className="w-full px-4 py-3 bg-obsidian-surface border border-obsidian-border rounded text-bone placeholder:text-bone-dim focus:outline-none focus:border-chartreuse text-sm"
                      />
                    </div>

                    <div className="space-y-1">
                      <label className="font-mono-tag text-xs text-bone-muted uppercase block">MESSAGE</label>
                      <textarea
                        rows={4}
                        required
                        placeholder="Share your thoughts, opportunity, or problem space..."
                        className="w-full px-4 py-3 bg-obsidian-surface border border-obsidian-border rounded text-bone placeholder:text-bone-dim focus:outline-none focus:border-chartreuse text-sm"
                      ></textarea>
                    </div>

                    <button
                      type="submit"
                      className="w-full py-4 bg-chartreuse text-obsidian font-mono-tag text-xs font-bold uppercase tracking-wider rounded-sm hover:bg-white transition-all shadow-[0_0_20px_rgba(212,249,51,0.2)] flex items-center justify-center gap-2"
                    >
                      <span>TRANSMIT MESSAGE</span>
                      <Icon name="send" className="w-4 h-4" />
                    </button>
                  </form>
                </div>

              </div>

            </div>
          </section>

          {/* ========================================================================= */}
          {/* FOOTER / COLOPHON                                                         */}
          {/* ========================================================================= */}
          <footer className="py-12 border-t border-obsidian-border bg-obsidian text-bone-dim font-mono-tag text-xs">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4">
              <div>
                <span className="text-bone font-medium">{data.meta.name}</span> · 
                <span className="text-chartreuse ml-1">STUDENT → BUILDER → LEADER</span>
              </div>
              <div className="text-center sm:text-right text-[11px]">
                <span>DESIGNED AS AN INDEPENDENT EDITORIAL OPERATING SPACE</span>
              </div>
            </div>
          </footer>

        </div>
      );
    }

    // Render React App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
