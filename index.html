  <!-- Sunlight Shader Script -->
  <script>
    (function initSunlightShader() {
      const canvas = document.getElementById('light-shader-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let width, height;
      let mouse = { x: 0.5, y: 0.3, targetX: 0.5, targetY: 0.3 };
      let time = 0;

      function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      window.addEventListener('mousemove', (e) => {
        mouse.targetX = e.clientX / width;
        mouse.targetY = e.clientY / height;
      });

      function render() {
        time += 0.003;
        mouse.x += (mouse.targetX - mouse.x) * 0.03;
        mouse.y += (mouse.targetY - mouse.y) * 0.03;

        ctx.clearRect(0, 0, width, height);

        const x1 = (mouse.x * 0.3 + 0.35 + Math.sin(time * 0.7) * 0.15) * width;
        const y1 = (mouse.y * 0.3 + 0.25 + Math.cos(time * 0.5) * 0.12) * height;
        const grad1 = ctx.createRadialGradient(x1, y1, 10, x1, y1, width * 0.55);
        grad1.addColorStop(0, 'rgba(255, 248, 220, 0.35)');
        grad1.addColorStop(0.5, 'rgba(250, 240, 215, 0.12)');
        grad1.addColorStop(1, 'rgba(244, 241, 234, 0)');
        ctx.fillStyle = grad1;
        ctx.fillRect(0, 0, width, height);

        const x2 = (0.7 - mouse.x * 0.2 + Math.cos(time * 0.4) * 0.1) * width;
        const y2 = (0.6 - mouse.y * 0.2 + Math.sin(time * 0.6) * 0.1) * height;
        const grad2 = ctx.createRadialGradient(x2, y2, 20, x2, y2, width * 0.45);
        grad2.addColorStop(0, 'rgba(27, 77, 62, 0.045)');
        grad2.addColorStop(0.6, 'rgba(27, 77, 62, 0.015)');
        grad2.addColorStop(1, 'rgba(244, 241, 234, 0)');
        ctx.fillStyle = grad2;
        ctx.fillRect(0, 0, width, height);

        requestAnimationFrame(render);
      }
      render();
    })();
  </script>

    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false };
      }
      static getDerivedStateFromError() {
        return { hasError: true };
      }
      componentDidCatch(error, errorInfo) {
        console.error("ErrorBoundary caught:", error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen bg-ivory text-ink flex items-center justify-center p-6 text-center font-mono-tag">
              <div className="max-w-md bg-white p-8 border border-ivory-border rounded shadow-lg space-y-4">

                    window.location.reload();
                  }}
                  className="px-4 py-2 bg-emeraldAccent text-white text-xs font-bold rounded"
                >
                  RELOAD PORTFOLIO
                </button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

                    <p className="mt-4 text-ink-muted text-base sm:text-lg font-light max-w-lg leading-relaxed">
                      {data.contact.subheadline}
                    </p>
                  </div>

                  <div className="p-6 paper-card rounded-sm space-y-4">
                    <div className="font-mono-tag text-xs text-emeraldAccent uppercase tracking-wider font-bold">
                      DIRECT INQUIRIES & COLLABORATIONS
                    </div>
                    
                    <div className="flex items-center justify-between p-3 bg-ivory-light border border-ivory-border rounded">
                      <span className="font-mono-tag text-xs text-ink">{data.meta.socials.email}</span>
                      <button
                        onClick={() => {
                          navigator.clipboard.writeText(data.meta.socials.email);
                          showToast("Email copied to clipboard!", "success");
                        }}
                        className="px-3 py-1 bg-emeraldAccent text-white font-mono-tag text-xs font-bold rounded hover:bg-ink shadow-xs"
                      >
                        COPY
                      </button>
                    </div>

                    <p className="font-mono-tag text-xs text-ink-muted">
                      📍 {data.contact.city} · {data.contact.availability}
                    </p>
                  </div>

                  <div className="space-y-3">
                    <span className="font-mono-tag text-xs text-ink-dim uppercase block font-bold">NETWORK & REPOSITORIES</span>
                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 font-mono-tag text-xs">
                      {[
                        { label: "LINKEDIN", url: data.meta.socials.linkedin },
                        { label: "GITHUB", url: data.meta.socials.github },
                        { label: "KAGGLE", url: data.meta.socials.kaggle },
                        { label: "LEETCODE", url: data.meta.socials.leetcode }
                      ].map((s, idx) => (
                        <a
                          key={idx}
                          href={s.url}
                          target="_blank"
                          rel="noreferrer"
                          className="p-3 bg-white border border-ivory-border hover:border-emeraldAccent text-ink-muted hover:text-emeraldAccent rounded-sm text-center flex items-center justify-center gap-1.5 transition-all shadow-xs"
                        >
                          <span>{s.label}</span>
                          <Icon name="arrow-up-right" className="w-3.5 h-3.5" />
                        </a>
                      ))}
                    </div>
                  </div>
                </div>

                <div className="lg:col-span-6">
                  <form
                    onSubmit={(e) => {
                      e.preventDefault();
                      showToast("Inquiry transmitted successfully! Dakshana will respond shortly.", "success");
                      e.target.reset();
                    }}
                    className="p-8 sm:p-10 paper-card rounded-sm space-y-6 shadow-md"
                  >
                    <h3 className="font-editorial text-2xl text-ink mb-2">
                      Send a Message or Opportunity
                    </h3>

                    <div className="space-y-1">
                      <label className="font-mono-tag text-xs text-ink-muted uppercase block font-semibold">YOUR NAME</label>
                      <input
                        type="text"
                        required
                        placeholder="Dr. Alex Rivera / Maya Patel"
                        className="w-full px-4 py-3 bg-ivory-light border border-ivory-border rounded text-ink placeholder:text-ink-dim focus:outline-none focus:border-emeraldAccent text-sm"
                      />
                    </div>

                    <div className="space-y-1">
                      <label className="font-mono-tag text-xs text-ink-muted uppercase block font-semibold">EMAIL ADDRESS</label>
                      <input
                        type="email"
                        required
                        placeholder="alex@enterprise.org"
                        className="w-full px-4 py-3 bg-ivory-light border border-ivory-border rounded text-ink placeholder:text-ink-dim focus:outline-none focus:border-emeraldAccent text-sm"
                      />
                    </div>

                    <div className="space-y-1">
                      <label className="font-mono-tag text-xs text-ink-muted uppercase block font-semibold">SUBJECT / TOPIC</label>
                      <input
                        type="text"
                        required
                        placeholder="Research Collaboration / Venture Discussion"
                        className="w-full px-4 py-3 bg-ivory-light border border-ivory-border rounded text-ink placeholder:text-ink-dim focus:outline-none focus:border-emeraldAccent text-sm"
                      />
                    </div>

                    <div className="space-y-1">
                      <label className="font-mono-tag text-xs text-ink-muted uppercase block font-semibold">MESSAGE</label>
                      <textarea
                        rows={4}
                        required
                        placeholder="Share your thoughts, opportunity, or problem space..."
                        className="w-full px-4 py-3 bg-ivory-light border border-ivory-border rounded text-ink placeholder:text-ink-dim focus:outline-none focus:border-emeraldAccent text-sm"
                      ></textarea>
                    </div>

                    <button
                      type="submit"
                      className="w-full py-4 bg-ink text-ivory font-mono-tag text-xs font-bold uppercase tracking-wider rounded-sm hover:bg-emeraldAccent transition-all shadow-md flex items-center justify-center gap-2"
                    >
                      <span>TRANSMIT MESSAGE</span>
                      <Icon name="send" className="w-4 h-4" />
                    </button>
                  </form>
                </div>

              </div>

            </div>
          </section>

          {/* ========================================================================= */}
          {/* COMPACT MINIMAL FOOTER                                                    */}
          {/* ========================================================================= */}
          <footer className="py-12 border-t border-ivory-border bg-ivory text-ink-dim font-mono-tag text-xs">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4">
              <div>
                <span className="text-ink font-semibold">{data.meta.name}</span> · 
                <span className="text-emeraldAccent ml-1 font-medium">STUDENT → BUILDER → LEADER</span>
              </div>
              <div className="text-center sm:text-right text-[11px]">
                <span>© {new Date().getFullYear()} DAKSHANA SRI M · STILL BUILDING.</span>
              </div>
            </div>
          </footer>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
